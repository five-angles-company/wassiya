# Static Astro output (build.format "directory": /legal/terms/index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a TLS proxy an absolute redirect would point at http://host:80.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # One consent-gated script (GA4) is the only third party this site loads.
    # Keep this list in step with src/scripts/consent.ts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Hashed file names, so a year is safe. `expires` rather than `add_header`:
    # any add_header in a location silently drops every header set above.
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
